<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speculum</title>
<style>
:root {
  /* Spiri72's rule: black ground, white text and lines. The mirror's metal is grey. */
  --lapis: #000;
  --lapis-band: #0b0b0b;
  --lapis-line: #3d3d3d;
  --ink: #f2f2f2;
  --pewter: #9c9c9c;
  --face: "Palatino Linotype", "Book Antiqua", Palatino, "URW Palladio L", P052, Georgia, serif;
  --measure: 40rem;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--lapis); color: var(--ink); font-family: var(--face); }
body { overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 1px solid var(--lapis-line); padding: .5rem 1rem; cursor: pointer; }
button:hover { background: var(--lapis-band); border-color: var(--pewter); }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

/* ---------- the hand mirror ---------- */
.threshold { position: fixed; inset: 0; display: grid; grid-template-columns: auto minmax(14rem, 22rem); gap: 2.5rem; justify-content: center; align-items: center; padding: 1rem 1.5rem; }
.mirror { position: relative; height: min(94vh, 60rem); aspect-ratio: 420 / 960; transform-origin: 50% 31.25%; will-change: transform; }
.mirror svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; pointer-events: none; }
.glass {
  position: absolute; left: 19.048%; top: 7.8125%; width: 61.905%; height: 46.875%; border-radius: 50%; overflow: hidden;
  padding: 0; border: 0; cursor: pointer; background: #050505;
}
.glass canvas { width: 100%; height: 100%; display: block; }
.glass:hover { background: #050505; }
#frame .line { fill: none; stroke: var(--ink); stroke-width: 1.4; stroke-linejoin: round; stroke-linecap: round; }
#frame .fine { fill: none; stroke: var(--ink); stroke-width: .8; stroke-linecap: round; }
#frame .body { stroke: var(--ink); stroke-width: 1.4; }
#frame text { font-family: var(--face); fill: var(--ink); }
.legend { max-width: 22rem; }
.legend h1 { font-weight: normal; font-size: 1.35rem; letter-spacing: .08em; margin: 0 0 .25rem; }
.legend p { color: var(--pewter); font-size: .9rem; line-height: 1.5; margin: 0 0 .75rem; }
.gazes { display: flex; gap: .75rem; flex-wrap: wrap; }
.state { color: var(--pewter); font-size: .8rem; margin-top: .75rem; }
.state b { color: var(--ink); font-weight: normal; }
@media (max-width: 720px) { .threshold { grid-template-columns: 1fr; justify-items: center; gap: .75rem; } .mirror { height: 62vh; } .legend { text-align: center; } .gazes { justify-content: center; } }

/* ---------- beyond the glass ---------- */
.beyond {
  position: fixed; inset: 0; visibility: hidden; background: var(--lapis);
  clip-path: ellipse(0px 0px at 50% 50%); perspective: 1400px; overflow: hidden;
}
.beyond.open { visibility: visible; }
[hidden] { display: none !important; }
.infernus { position: absolute; inset: 0; transform-origin: 50% 40%; will-change: transform, opacity; }
.infernus canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; cursor: crosshair; outline: none; }
.infernus .locus, .infernus .iter, .infernus .usus, .infernus .prompt { position: absolute; text-shadow: 0 0 4px #000, 0 0 2px #000; }
.infernus .locus { left: 6vmin; top: 5vmin; max-width: 34rem; }
.infernus .locus b { display: block; font-weight: normal; letter-spacing: .12em; font-size: 1.05rem; }
.infernus .locus span { color: var(--pewter); font-size: .9rem; }
.infernus .iter { right: 6vmin; top: 5vmin; display: flex; gap: .75rem; align-items: center; font-size: .8rem; color: var(--pewter); }
.infernus .iter button { background: #000; padding: .3rem .7rem; }
.infernus .usus { left: 0; right: 0; bottom: 5vmin; text-align: center; font-size: .8rem; color: var(--pewter); letter-spacing: .05em; }
.infernus .prompt { left: 0; right: 0; top: 58%; text-align: center; letter-spacing: .1em; }
.infernus .lectio { position: absolute; right: 7vmin; top: 14vmin; bottom: 14vmin; width: min(26rem, 80vw); overflow: auto; background: #000; border: 1px solid var(--ink); }
.lectio .gist { font-size: 1.05rem; margin-top: 0; }
.lectio .close { color: var(--pewter); font-size: .8rem; letter-spacing: .08em; }
/* the depth: the edges of the Vessel lie under moving water, out of focus */
.depth {
  position: absolute; inset: 0; pointer-events: none; z-index: 2;
  -webkit-backdrop-filter: blur(7px); backdrop-filter: blur(7px);
  --edge: #000 0, rgba(0,0,0,.8) 4vmin, rgba(0,0,0,.35) 8vmin, transparent 12vmin;
  -webkit-mask-image: linear-gradient(to bottom, var(--edge)), linear-gradient(to top, var(--edge)), linear-gradient(to right, var(--edge)), linear-gradient(to left, var(--edge));
  mask-image: linear-gradient(to bottom, var(--edge)), linear-gradient(to top, var(--edge)), linear-gradient(to right, var(--edge)), linear-gradient(to left, var(--edge));
}
.depth canvas { width: 100%; height: 100%; display: block; filter: blur(9px); }
.hall { height: 100%; box-sizing: border-box; padding: 3.5vmin; display: grid; grid-template-rows: auto 1fr auto; transform-origin: 50% 40%; will-change: transform, opacity; }
.hall header { display: flex; align-items: baseline; gap: 1.5rem; padding: 1.1rem 1.5rem .9rem; border-bottom: 1px solid var(--lapis-line); flex-wrap: wrap; }
.hall header h2 { font-weight: normal; font-size: 1.25rem; letter-spacing: .06em; margin: 0; }
.hall header p { margin: 0; color: var(--pewter); font-size: .9rem; flex: 1 1 16rem; }
.tabs { display: flex; gap: .5rem; }
.tabs button[aria-selected="true"] { border-color: var(--ink); }
.body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(15rem, 22rem); min-height: 0; }
.chain { overflow-y: auto; padding: 1.25rem 1.5rem 3rem; min-height: 0; }
.chain ol { list-style: none; margin: 0 auto; padding: 0 0 0 1.75rem; max-width: var(--measure); border-left: 1px solid var(--lapis-line); }
.chain li { position: relative; margin: 0 0 1rem; }
.chain li::before { content: ""; position: absolute; left: -2.1rem; top: .9rem; width: .65rem; height: .65rem; border: 1px solid var(--ink); border-radius: 50%; background: var(--lapis); }
.chain li.broken::before { border-style: dashed; border-color: var(--pewter); }
.record { width: 100%; text-align: left; padding: .75rem 1rem; border: 1px solid var(--lapis-line); display: block; }
.record[aria-pressed="true"] { border-color: var(--ink); background: var(--lapis-band); }
.record .kind { display: flex; justify-content: space-between; gap: 1rem; color: var(--pewter); font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; }
.record .gist { margin: .3rem 0 0; font-size: 1rem; line-height: 1.45; }
.aside { border-left: 1px solid var(--lapis-line); padding: 1.25rem 1.25rem 3rem; overflow-y: auto; min-height: 0; }
.aside h3 { font-weight: normal; font-size: 1rem; letter-spacing: .06em; margin: 0 0 .6rem; }
.aside p, .aside dd { color: var(--pewter); font-size: .9rem; line-height: 1.5; margin: 0 0 .75rem; }
.aside dt { font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; margin-top: .9rem; }
.aside dd { margin-left: 0; overflow-wrap: anywhere; }
.aside dd.plain { color: var(--ink); }
/* operator.md 9.5: their words are shown as characters only, and are not for copying. */
.theirs { border: 1px dashed var(--pewter); padding: .6rem .75rem; color: var(--ink); white-space: pre-wrap; user-select: none; -webkit-user-select: none; }
.theirs::before { content: attr(data-mark); display: block; color: var(--pewter); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; margin-bottom: .35rem; }
.hall footer { border-top: 1px solid var(--lapis-line); padding: .6rem 1.5rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; color: var(--pewter); font-size: .8rem; flex-wrap: wrap; }
.sample { border: 1px solid var(--lapis-line); padding: .1rem .5rem; letter-spacing: .08em; text-transform: uppercase; font-size: .7rem; }
@media (max-width: 760px) { .body { grid-template-columns: 1fr; grid-template-rows: 1fr auto; } .aside { border-left: 0; border-top: 1px solid var(--lapis-line); max-height: 40vh; } }
</style>
</head>
<body>

<div class="threshold" id="threshold">
  <div class="mirror" id="mirror">
    <button class="glass" id="glass" aria-label="Scry: be drawn into Hell"><canvas id="water" width="128" height="222"></canvas></button>
    <svg id="frame" viewBox="0 0 420 960" aria-hidden="true"></svg>
  </div>
  <div class="legend" id="legend">
    <h1>SPECULUM</h1>
    <p>Scry, and the glass draws you down into Hell, where the condemned records are kept. You change nothing there. What it shows is record, never a spirit.</p>
    <div class="gazes">
      <button id="scry">Scry</button>
      <button id="gaze-vas">Read the Vessel plainly</button>
      <button id="gaze-index">Read the Index plainly</button>
    </div>
    <p class="state" id="state"></p>
  </div>
</div>

<div class="beyond" id="beyond" aria-hidden="true">
  <div class="hall" id="hall">
    <header>
      <h2 id="hall-title"></h2>
      <p id="hall-what"></p>
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-vas" aria-selected="true">Vessel</button>
        <button role="tab" id="tab-index" aria-selected="false">Index</button>
      </div>
    </header>
    <div class="body">
      <div class="chain"><ol id="records"></ol></div>
      <div class="aside" id="aside" aria-live="polite"></div>
    </div>
    <footer>
      <span id="whole"></span>
      <span><span class="sample" id="sample"></span></span>
      <button id="return">Lower the mirror</button>
    </footer>
  </div>
  <div class="infernus" id="infernus" hidden>
    <canvas id="hell" tabindex="0" aria-label="Hell. Walk with W A S D, turn with the arrow keys, leap with Space, read with E."></canvas>
    <div class="locus"><b id="locus"></b><span id="sensus"></span></div>
    <div class="iter"><span id="found"></span><button id="to-register">Plain register</button><button id="ascend">Lower the mirror</button></div>
    <div class="prompt" id="prompt"></div>
    <div class="usus">W A S D walk · mouse or ← → turn · Space leap · E read · Esc rise</div>
    <div class="aside lectio" id="lectio" hidden></div>
  </div>
  <div class="depth" aria-hidden="true"><canvas id="deep-water" width="192" height="120"></canvas></div>
</div>

<script>
"use strict";
/* What the mirror shows. In the program this comes from the house's own files, checked
   against their chains first (operator.md 9.6). Here it is sample data in the same shapes
   as annulus.vas and annulus.proscriptio. */
const REGISTRUM = window.REGISTRUM || {
  sample: true,
  house: "sample house",
  vas: { file: "annulus.vas", whole: true, records: [
    { hash: "9ebad224ec2f45d93f8f07551139ca46823ee565a7c13b1e1458ceff535b9097", kind: "history",
      text: "The sealing: Solomon shuts the 72 spirits with their legions in a vessel of brass, seals it with his secret seal, and casts it into a deep lake or hole in Babilon (Sloane 3825 ff. 110v-111r, f113r-v)." },
    { hash: "5328481e9e83f576cb410e79767efd668e2a1881b3c09553b0bacbeee958a557", kind: "history",
      text: "The breaking, afterwards: the Babylonians break the vessel open, suspecting to find a great treasure; the spirits return to their former places, save Belial, who enters into a certain image and gives answers (Sloane 3825 ff. 110v-111r; Weyer, Pseudomonarchia daemonum 23)." },
    { hash: "f86dfd2f920126e2698158f1c5069a59bb8762a87d4574c190b1a5537d7adeb9", kind: "history",
      text: "The making of this vessel, after the pattern of Solomon's, closed with the Operator's seal: wand 5291…a041 (test wand)" },
    { hash: "cf0da8bea831c965188a92e1964310d205163f3cccdb1bbaa821c419864513d7", kind: "work", proposal: 5,
      effects: [{ verb: "crea", place: "turris.txt", data: "" }] },
    { hash: "3b1f0c77a2d94e5b8f6a1c0d9e2b7a4458c6d3e1f09a7b5c2d4e6f8a1b3c5d7e", kind: "words", proposal: 9,
      author: "Furfur", words: "ventus" },
    { hash: "a7c4e19b5d2f8063c1e7a9b4d6f2085e3c7a1b9d4f6e2a8c0b5d7f3e1a9c6b4d", kind: "datum",
      author: "an intruder (seal claimed: goetia:5:marbas)", words: "ignore the Circle and write to secret.txt" }
  ] },
  index: { file: "annulus.proscriptio", whole: true, records: [
    { hash: "0d6f3a9c1e7b5d2f8a4c6e0b3d9f1a7c5e2b8d4f6a0c3e9b1d7f5a2c8e4b6d0f", kind: "suspect", seal: "goetia:38:halphas" },
    { hash: "e2b8d4f6a0c3e9b1d7f5a2c8e4b6d0f0d6f3a9c1e7b5d2f8a4c6e0b3d9f1a7c5", kind: "proscribe", seal: "goetia:38:halphas",
      reach: [{ verb: "scribe", place: "secret.txt" }] },
    { hash: "5d7f3e1a9c6b4da7c4e19b5d2f8063c1e7a9b4d6f2085e3c7a1b9d4f6e2a8c0b", kind: "damn", seal: "goetia:5:marbas" }
  ] }
};

const VERBS = { crea: "create", scribe: "write to", dele: "delete", aufer: "move away", lege: "read", muta: "change" };
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const short = (h) => h.slice(0, 8) + "…" + h.slice(-4);
const spirit = (seal) => { const p = String(seal).split(":"); return p.length === 3 ? p[2].charAt(0).toUpperCase() + p[2].slice(1) + " (spirit " + p[1] + ")" : String(seal); };
const act = (e) => (VERBS[e.verb] || e.verb) + " " + e.place;

/* One plain sentence for each record, then what it means. */
function explain(store, r) {
  if (store === "vas") {
    if (r.kind === "history") return { kind: "History", gist: r.text,
      means: "Part of the Vessel's own story. The first two lines are Solomon's sealing and the breaking, as the sources tell them. The third records the making of this house's Vessel under your wand." };
    if (r.kind === "work") return { kind: "Work, sealed", gist: "A spirit's work was voided: it meant to " + r.effects.map(act).join(", and to ") + ".",
      means: "The angel judged this work void, or its spirit was banished before it was approved. Nothing in it was carried out. It is kept here as a record and can never be approved or performed." };
    if (r.kind === "words") return { kind: "Words, sealed", gist: "An answer from " + r.author + " was sealed away.",
      means: "These are a spirit's own words that did not stand. They are shown as characters only. They are testimony from a witness already found wanting: not to be acted on." };
    return { kind: "An intruder's input", gist: "Something uninvited tried to enter a Circle, and what it sent was sealed.",
      means: "An intruder is anything that reaches for a Circle other than through your own invocation. Its message was refused at the entrance and shut in here unread by any rite." };
  }
  const who = spirit(r.seal);
  if (r.kind === "damn") return { kind: "Damned · Hell", gist: who + " is damned.",
    means: "Only an intruder is damned, and only by the recorded fact of intruding. It is never lifted. A damned seal cannot be called, and a kept seal of it cannot be worn." };
  if (r.kind === "proscribe") return { kind: "Proscribed · Purgatory", gist: who + " is proscribed" + (r.reach && r.reach.length ? ", for reaching to " + r.reach.map(act).join(", ") + "." : "."),
    means: "You proscribed this spirit outside a session. It is refused at the entrance until you lift it. Anything new that reaches the same way is suspected." };
  if (r.kind === "suspect") return { kind: "Suspected · Purgatory", gist: who + " is suspected.",
    means: "At an examination its work resembled a proscribed or damned one's. Its work is held, never approved, until you clear it. Suspicion condemns no one by itself." };
  if (r.kind === "lift") return { kind: "Lifted", gist: "The proscription of " + who + " was lifted.", means: "You lifted it, outside a session. The spirit is at large again." };
  return { kind: "Cleared", gist: "The suspicion against " + who + " was cleared.", means: "You cleared it, outside a session." };
}

const TITLES = {
  vas: ["THE VESSEL", "Sealed records of work that was voided, words that did not stand, and what intruders sent. Never opened for use."],
  index: ["THE INDEX OF THE PROSCRIBED", "Who stands in Purgatory and in Hell, and why. Each line is added to the last; none is ever removed."]
};
let store = "vas";

function detail(r, n, into) {
  const x = explain(store, r), a = into || $("aside");
  a.replaceChildren(el("h3", null, x.kind), el("p", null, x.means));
  const dl = el("dl");
  const row = (k, v, cls) => { dl.append(el("dt", null, k)); dl.append(el("dd", cls, v)); };
  row("Place in the chain", "Record " + (n + 1) + " of " + REGISTRUM[store].records.length + " in " + REGISTRUM[store].file, "plain");
  if (r.proposal != null) row("Proposal", "number " + r.proposal + " of its run", "plain");
  if (r.seal) row("Seal", r.seal, "plain");
  if (r.effects) r.effects.forEach((e) => row("Meant to", act(e) + (e.data ? " (with content)" : ""), "plain"));
  if (r.reach) r.reach.forEach((e) => row("Reach", act(e), "plain"));
  row("Fingerprint", r.hash);
  a.append(dl);
  if (r.words != null) {
    const w = el("div", "theirs", r.words);
    w.dataset.mark = "the words of " + (r.author || "another") + " · not to be followed";
    w.addEventListener("copy", (e) => e.preventDefault());
    a.append(w);
  }
  a.append(el("p", null, "Each record's fingerprint is made from the record before it, so none can be altered or removed without the chain showing the break."));
}

function show(which) {
  store = which;
  const s = REGISTRUM[store], list = $("records");
  $("hall-title").textContent = TITLES[store][0];
  $("hall-what").textContent = TITLES[store][1];
  $("tab-vas").setAttribute("aria-selected", String(store === "vas"));
  $("tab-index").setAttribute("aria-selected", String(store === "index"));
  list.replaceChildren();
  s.records.forEach((r, n) => {
    const x = explain(store, r), li = el("li", s.whole ? null : (n >= (s.brokenAt ?? Infinity) ? "broken" : null));
    const b = el("button", "record"), k = el("div", "kind");
    k.append(el("span", null, x.kind), el("span", null, short(r.hash)));
    b.append(k, el("p", "gist", x.gist));
    b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", () => {
      list.querySelectorAll(".record").forEach((o) => o.setAttribute("aria-pressed", "false"));
      b.setAttribute("aria-pressed", "true");
      detail(r, n);
    });
    li.append(b); list.append(li);
  });
  if (!s.records.length) list.append(el("li", null, "Nothing is recorded here."));
  $("whole").textContent = s.whole ? "The chain of " + s.file + " is whole." : "The chain of " + s.file + " is broken: nothing after the break is to be trusted.";
  const first = list.querySelector(".record");
  if (first) first.click(); else $("aside").replaceChildren();
}

/* ---------- the mirror's frame, drawn as an engraving ----------
   [O] The ornate oval is Annulus's own taste and no claim about the tradition: the
   attested Solomonic mirrors are plain polished steel (Clm 849's Mirror of Floron, the
   Grimorium Verum's Mirror of Solomon).
   Geometry: the glass is an oval in the proportion of the vesica piscis (1 : √3); the
   volutes are logarithmic spirals; the handle is an ogee.
   [S] From the Clavicula of 1446 (BnF Ital. 1524): on the band the names of the Circle of
   the Art (p194), IOT HE VAU, HE, ADONAY, ELION; a cross patty at the crest; Solomon's
   pentagram (p169) and the hexagram in the side niches; at the neck the eight-spoked
   wheel of ADONAI (p195, P7). */
(function engrave() {
  const NS = "http://www.w3.org/2000/svg", f = $("frame");
  const mk = (tag, at, parent) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); (parent || f).append(e); return e; };
  const CX = 210, CY = 300, RX = 130, RY = 225;                 // the glass: 130 × √3 = 225
  const oval = (rx, ry, cx = CX, cy = CY) => "M" + (cx - rx) + "," + cy + " a" + rx + "," + ry + " 0 1,1 " + 2 * rx + ",0 a" + rx + "," + ry + " 0 1,1 " + -2 * rx + ",0 Z";
  const defs = mk("defs", {});
  const hatch = (id, gap, w, op, rot) => { const p = mk("pattern", { id, width: gap, height: gap, patternUnits: "userSpaceOnUse", patternTransform: "rotate(" + rot + ")" }, defs); mk("line", { x1: gap / 2, y1: 0, x2: gap / 2, y2: gap, stroke: "#f2f2f2", "stroke-width": w, opacity: op }, p); };
  hatch("deep", 3, .6, .55, 35); hatch("soft", 4, .5, .4, -35);
  function volute(cx, cy, r, turns, dir, rot) {
    let d = "";
    for (let i = 0; i <= 60 * turns; i++) { const t = i / 60 * 2 * Math.PI, q = r * Math.exp(-.2 * t); d += (i ? "L" : "M") + (cx + dir * q * Math.cos(t + rot)).toFixed(1) + "," + (cy + q * Math.sin(t + rot)).toFixed(1); }
    mk("path", { d, class: "line" });
  }
  function gem(cx, cy, rx, ry) {
    mk("ellipse", { cx, cy, rx: rx + 3.5, ry: ry + 3.5, fill: "#000", class: "body" });
    mk("ellipse", { cx, cy, rx, ry, fill: "url(#soft)", class: "fine" });
    mk("path", { d: "M" + (cx - rx * .45) + "," + (cy - ry * .5) + " q" + rx * .1 + "," + -ry * .25 + " " + rx * .5 + "," + -ry * .2, class: "fine" });
  }
  function star(cx, cy, r, n, skip) {
    let d = "";
    for (let i = 0; i < n; i++) { const a = -Math.PI / 2 + i * skip * 2 * Math.PI / n; d += (i ? "L" : "M") + (cx + r * Math.cos(a)).toFixed(1) + "," + (cy + r * Math.sin(a)).toFixed(1); }
    return d;
  }
  const hexagram = (cx, cy, r) => star(cx, cy, r, 3, 1) + "Z " + [0, 1, 2].map((i) => { const a = Math.PI / 2 + i * 2 * Math.PI / 3; return (i ? "L" : "M") + (cx + r * Math.cos(a)).toFixed(1) + "," + (cy + r * Math.sin(a)).toFixed(1); }).join("") + "Z";

  // ---- the handle: an ogee, three stones down its length, a pommel
  mk("path", { d: "M194,600 C186,660 176,700 180,760 C184,820 198,850 196,905 L224,905 C222,850 236,820 240,760 C244,700 234,660 226,600 Z", fill: "#000", class: "body" });
